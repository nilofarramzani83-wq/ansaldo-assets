<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود · بایگانی پرسنلی</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="logo">
  <img src="/logo.png" alt="Ansaldo Energia">
</div>
<div class="page-card fade-in">
<h1>ورود به بایگانی پرسنلی</h1>
<p>این بخش مخصوص منابع انسانی و مدیریت است.</p>

<form method="POST" action="/bayegani/login" id="login-form">
  <label for="username">نام کاربری</label>
  <input type="text" id="username" name="username" autocomplete="username" required>

  <label for="password">رمز عبور</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>

  <button class="btn" type="submit">ورود</button>
</form>

<p id="login-error" style="display:none; color:var(--red); margin-top:14px;">
  نام کاربری یا رمز عبور اشتباه است.
</p>

<a class="btn btn-secondary" href="/" style="margin-top:10px;">بازگشت به صفحه اصلی</a>
</div>

<script>
if (new URLSearchParams(location.search).get('error') === '1') {
  document.getElementById('login-error').style.display = 'block';
}
</script>
</body>
</html>
