<!doctype html> 
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود · بایگانی پرسنل</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="logo">
    <span class="ansaldo">ansaldo</span>
    <span class="divider"></span>
    <span class="energia">energia</span>
  </div>

  <div class="page-card">
    <h1>ورود به بایگانی پرسنل</h1>
    <p>این بخش خصوصی است و فقط برای مدیران و منابع انسانی در دسترس است.</p>

    <form id="login-form">
      <label for="username">ایمیل سازمانی</label>
      <input id="username" type="email" placeholder="name@ansaldoenergia.ir" autocomplete="username" required>

      <label for="password" style="margin-top:14px; display:block;">رمز عبور</label>
      <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required>

      <button class="btn" type="submit" style="margin-top:20px;">ورود</button>
      <p id="login-error" style="color:var(--red); font-size:13px; text-align:center; margin-top:12px; display:none;"></p>
    </form>

    <p style="margin-top:18px;"><a href="/" style="color:#9B9B9B; font-size:13px;">‹ بازگشت به صفحه اصلی</a></p>
  </div>

<script>
const form = document.getElementById("login-form");
const errorEl = document.getElementById("login-error");
const submitBtn = form.querySelector("button[type=submit]");

function getNextPath() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next");
  if (next && next.startsWith("/")) return next;
  return "/personnel/";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "در حال ورود...";

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      errorEl.textContent = data.error || "ورود ناموفق بود.";
      errorEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "ورود";
      return;
    }

    window.location.href = getNextPath();
  } catch (err) {
    errorEl.textContent = "خطا در برقراری ارتباط. دوباره تلاش کنید.";
    errorEl.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "ورود";
  }
});
</script>
</body>
</html>
