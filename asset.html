<!DOCTYPE html>
<html lang="en">
 
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asset Information</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="asset-card">

<div class="top">

<img src="logo/logo.png" class="logo">

<div class="lang">

<button id="faBtn">🇮🇷</button>

<button id="enBtn">🇬🇧</button>

</div>

</div>

<h1 id="pageTitle">

Asset Information

</h1>

<div class="asset-image">

<img id="assetImage" src="">

</div>

<div class="table">

<div class="item">

<span>Name</span>

<p id="name">-</p>

</div>

<div class="item">

<span>Model</span>

<p id="model">-</p>

</div>

<div class="item">

<span>Department</span>

<p id="department">-</p>

</div>

<div class="item">

<span>Location</span>

<p id="location">-</p>

</div>

<div class="item">

<span>Asset Code</span>

<p id="code">-</p>

</div>

<div class="item">

<span>Serial Number</span>

<p id="serial">-</p>

</div>

<div class="item">

<span>Status</span>

<p id="status">-</p>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
