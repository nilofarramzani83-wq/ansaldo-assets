<!doc<!doctype html>
<html lang="fa" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ansaldo Assets</title>

<link rel="stylesheet" href="/style.css">

</head>


<body>

<div class="logo">
  <img src="/logo.png" alt="Ansaldo Energia">
</div>


<div class="page-card">


<h1>سامانه مدیریت اموال شرکت</h1>


<!-- Dashboard Stats -->
<div class="stats-box">

    <div class="stat">
        <span id="totalAssets">0</span>
        <small>کل اموال</small>
    </div>


    <div class="stat">
        <span id="activeAssets">0</span>
        <small>فعال</small>
    </div>


    <div class="stat">
        <span id="departmentCount">0</span>
        <small>واحدها</small>
    </div>

</div>


<p>
با اسکن QR Code هر وسیله، اطلاعات کامل همان دارایی نمایش داده می‌شود.
</p>



<a class="btn" href="/qr-generator.html">
ساخت QR Code جدید
</a>


<a class="btn" href="/qr-generator.html#download-all">
دانلود ZIP همه QR Code ها
</a>


<a class="btn" href="/qr/AEI-IT-001-TEH">
مشاهده نمونه دارایی
</a>



<p style="margin-top:25px;">
نمونه کدها:
</p>


<div class="example-codes">

<a href="/qr/AEI-IT-001-TEH">
AEI-IT-001-TEH
</a>


<a href="/qr/AEI-FUR-041-TEH">
AEI-FUR-041-TEH
</a>


<a href="/qr/AEI-APP-010-TEH">
AEI-APP-010-TEH
</a>


</div>


</div>

<a class="btn" href="/assets-list.html">
اموال شرکت
</a>


<script>

fetch("/asset-codes.json")
.then(response => response.json())
.then(data => {


let assets = Object.values(data);


// تعداد کل اموال
document.getElementById("totalAssets").innerText =
assets.length;


// تعداد فعال
let active =
assets.filter(item => item.status === "فعال").length;


document.getElementById("activeAssets").innerText =
active;



// تعداد واحدها
let departments = [
...new Set(
assets.map(item => item.location)
.filter(Boolean)
)
];


document.getElementById("departmentCount").innerText =
departments.length;


})

.catch(error => {
console.log("خطا در خواندن اطلاعات:", error);
});


</script>



</body>
</html>
