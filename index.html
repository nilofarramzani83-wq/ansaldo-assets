<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ansaldo Assets</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="logo">
    <span class="energia">energia</span>
    <span class="divider"></span>
    <span class="ansaldo">ansaldo</span>
</div>

<div class="page-card" style="text-align:center">

    <h1>سامانه مدیریت اموال</h1>

    <p>
        مشاهده مشخصات دارایی‌های سازمانی
        <br>
        با اسکن QR Code یا وارد کردن کد اموال
    </p>

    <img
        src="assets/qr.png"
        alt="QR"
        style="width:180px;margin:25px auto 10px;display:block;"
    >

    <label>کد اموال</label>

    <input
        id="assetCode"
        placeholder="AEI-IT-001"
    >

    <button class="btn" onclick="goAsset()">
        مشاهده اطلاعات
    </button>

</div>

<script>

function goAsset(){

const code=document.getElementById("assetCode").value.trim();

if(!code)return;

window.location.href="./asset.html?code="+encodeURIComponent(code);

}

</script>

</body>
</html>
