<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بایگانی پرسنل · ansaldoassets</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="logo">
    <span class="ansaldo">ansaldo</span>
    <span class="divider"></span>
    <span class="energia">energia</span>
  </div>

  <div class="page-card" id="view-branches">
    <h1>بایگانی پرسنل</h1>
    <p>یک شعبه را انتخاب کنید.</p>
    <div class="dept-grid" id="branch-buttons">
      <button class="dept-card" data-branch="مرکزی">دفتر مرکزی</button>
      <button class="dept-card disabled" disabled>کاسپین<br><span class="soon">به‌زودی</span></button>
      <button class="dept-card disabled" disabled>هریس<br><span class="soon">به‌زودی</span></button>
      <button class="dept-card disabled" disabled>دالاهو<br><span class="soon">به‌زودی</span></button>
    </div>
    <p style="margin-top:22px;"><a href="#" id="logout-link" style="color:#9B9B9B; font-size:13px;">خروج از حساب</a></p>
  </div>

  <div class="page-card" id="view-departments" style="display:none;">
    <button class="back-link" id="back-to-branches">‹ بازگشت</button>
    <h1>بخش‌های دفتر مرکزی</h1>
    <p>یک بخش را انتخاب کنید.</p>
    <div class="dept-grid" id="dept-buttons"></div>
  </div>

  <div class="page-card" id="view-list" style="display:none;">
    <button class="back-link" id="back-to-departments">‹ بازگشت</button>
    <h1 id="list-title">پرسنل</h1>
    <input id="list-search" type="text" placeholder="جستجو در نام..." autocomplete="off">
    <div id="person-list" class="asset-list"></div>
  </div>

<script>
const DEPARTMENTS = ["مالی", "مدیریت", "تدارکات", "فنی", "اتاق کنفرانس", "اداری", "آشپزخانه"];

let ALL_PERSONNEL = null; // { department: [{id,name}, ...], ... }

async function loadPersonnel() {
  if (ALL_PERSONNEL) return ALL_PERSONNEL;
  const res = await fetch("/personnel/data");
  if (res.status === 401 || res.redirected) {
    window.location.href = "/login.html";
    return {};
  }
  ALL_PERSONNEL = await res.json();
  return ALL_PERSONNEL;
}

const viewBranches = document.getElementById("view-branches");
const viewDepartments = document.getElementById("view-departments");
const viewList = document.getElementById("view-list");
const deptButtons = document.getElementById("dept-buttons");
const personListEl = document.getElementById("person-list");
const listTitle = document.getElementById("list-title");
const listSearch = document.getElementById("list-search");

function showView(view) {
  [viewBranches, viewDepartments, viewList].forEach((v) => (v.style.display = "none"));
  view.style.display = "block";
  view.classList.remove("fade-in");
  void view.offsetWidth;
  view.classList.add("fade-in");
}

document.querySelectorAll('.dept-card[data-branch="مرکزی"]').forEach((btn) => {
  btn.addEventListener("click", async () => {
    deptButtons.innerHTML = Array.from({ length: 6 })
      .map(() => `<div class="dept-card skeleton" style="height:58px;"></div>`)
      .join("");
    showView(viewDepartments);
    await loadPersonnel();
    renderDepartments();
  });
});

function renderDepartments() {
  deptButtons.innerHTML = "";
  DEPARTMENTS.forEach((dept) => {
    const people = ALL_PERSONNEL[dept] || [];
    const btn = document.createElement("button");
    btn.className = "dept-card";
    btn.innerHTML = `${dept}<br><span class="soon">${people.length} نفر</span>`;
    btn.addEventListener("click", () => openList(dept));
    deptButtons.appendChild(btn);
  });
}

let currentDept = null;

function openList(dept) {
  currentDept = dept;
  listTitle.textContent = dept;
  listSearch.value = "";
  renderList();
  showView(viewList);
}

function renderPersonRow(container, p) {
  const row = document.createElement("a");
  row.className = "asset-row";
  row.href = `/personnel/profile/${encodeURIComponent(p.id)}`;
  row.innerHTML = `<span class="asset-row-name">${p.name}</span>`;
  container.appendChild(row);
}

function renderList() {
  const q = listSearch.value.trim();
  const people = (ALL_PERSONNEL[currentDept] || []).filter((p) => !q || p.name.includes(q));

  personListEl.innerHTML = "";
  personListEl.classList.remove("fade-in");
  void personListEl.offsetWidth;
  personListEl.classList.add("fade-in");

  if (!people.length) {
    personListEl.innerHTML = '<p style="color:#9B9B9B; font-size:13px;">هنوز پرسنلی برای این بخش ثبت نشده.</p>';
    return;
  }

  people.forEach((p) => renderPersonRow(personListEl, p));
}

listSearch.addEventListener("input", renderList);
document.getElementById("back-to-branches").addEventListener("click", () => showView(viewBranches));
document.getElementById("back-to-departments").addEventListener("click", () => showView(viewDepartments));

document.querySelectorAll(".dept-card.disabled").forEach((btn) => {
  btn.addEventListener("click", () => alert("پرسنل این شعبه هنوز ثبت نشده است."));
});

document.getElementById("logout-link").addEventListener("click", async (e) => {
  e.preventDefault();
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/";
});
</script>
</body>
</html>
